name: CompatHelper

# Opens a pull request widening a [compat] bound when a dependency releases a
# version outside it, for the package and for the docs environment.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install CompatHelper
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add(name = "CompatHelper")
      - name: Run CompatHelper
        shell: julia --color=yes {0}
        run: |
          using CompatHelper
          CompatHelper.main(; subdirs = ["", "docs"])
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
