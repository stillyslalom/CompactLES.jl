name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - serial
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'pre'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      # The device testsets and the MPI device phases run here, so the
      # workload's device block earns its precompile cost in this job and
      # nowhere else; see PRECOMPILE_DEVICE in src/precompile.jl. Neither
      # this step nor buildpkg precompiles: an image Pkg.instantiate built
      # here would predate the preference and be rebuilt by the first `using`
      # (measured 330 s of every job), and the serial suite builds its own at
      # -O1 with bounds checks in any case.
      - name: Set the device precompile preference
        shell: julia --project=. --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          using Pkg
          Pkg.instantiate()
          using Preferences
          Preferences.set_preferences!(
              Base.UUID("b1f6c1e2-4a83-4c5f-9d2e-7c3a1e5b8f10"),
              "precompile_device" => true; force=true)
      - uses: julia-actions/julia-buildpkg@v1
      # At -O1: the serial suite is compile-bound, and -O1 reuses the -O2
      # image buildpkg made (see test/runtests.jl). julia-runtest has no
      # optimization input, so this is its Pkg.test call with the flag added;
      # Pkg.test keeps its own --check-bounds=yes.
      #
      # The extension suites skip where their weak dependency does not load,
      # and a skip is recorded as a broken test, not a pass. HDF5 is in the
      # test target, so this job expects that suite to run: `require=hdf5`
      # fails the job on the skip instead. Makie is expected to skip here
      # (CairoMakie is not in the test target) and runs in the docs job.
      # `timing=true` prints each testset's wall and compile time after the
      # summary tree (see test/runtests.jl).
      - name: Run the serial suite at -O1
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.test(; coverage=false, julia_args=["-O1"],
                   test_args=["require=hdf5", "timing=true"])

  numerics:
    name: Convergence and MPI at 2 ranks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      # The device testsets and the MPI device phases run here, so the
      # workload's device block earns its precompile cost in this job and
      # nowhere else; see PRECOMPILE_DEVICE in src/precompile.jl. Neither
      # this step nor buildpkg precompiles: an image Pkg.instantiate built
      # here would predate the preference and be rebuilt by the first `using`
      # (measured 330 s of every job). The first `using CompactLES`, in
      # convergence.jl, builds the image every later process loads.
      - name: Set the device precompile preference
        shell: julia --project=. --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          using Pkg
          Pkg.instantiate()
          using Preferences
          Preferences.set_preferences!(
              Base.UUID("b1f6c1e2-4a83-4c5f-9d2e-7c3a1e5b8f10"),
              "precompile_device" => true; force=true)
      - uses: julia-actions/julia-buildpkg@v1
      # Whether the restored depot holds a loadable image of this source, with
      # the CPU name and the loader's reason for each CompactLES image it
      # rejects. On runs whose source had not changed, the eight-rank job
      # reused its cached image every time and this job rebuilt its own in
      # four of six, at 7 min each. The image limit does not account for it:
      # an eviction removes the least recently loaded image, and the image the
      # previous run built is the most recently loaded one.
      - name: Report the restored package image
        env:
          JULIA_DEBUG: loading
        run: |
          ls -l ~/.julia/compiled/v*/CompactLES || true
          julia --project=. -e 'println(Sys.CPU_NAME, ": image current = ",
              Base.isprecompiled(Base.identify_package("CompactLES")))'
      # Neither step below runs with `--check-bounds=yes`. That option gives
      # every package in the tree a second precompile cache, which this job
      # would build from scratch before its first test, and it slows every
      # process the distributed step launches. The serial suite is already
      # bounds-checked on three Julia versions by julia-runtest, and an index
      # error in the distributed paths moves a convergence order or an
      # interface error away from machine zero, so it does not pass unseen.
      - name: Run convergence guards
        run: julia --project=. --color=yes test/convergence.jl
      # The full distributed suite runs at np = 2; the comment on the
      # eight-rank job says why np = 8 runs a selection. Each wall-flux phase
      # runs here only: at np = 2 each rank already lacks one wall, which is
      # the case where a collective below an early return deadlocks. The
      # neutral-transport domain tests also run at np = 2 only: their
      # rank-local fault is on the last rank and their fine level sits on one
      # rank at every rank count, so np = 8 adds no case. `-t 1` because a
      # rank must not also fan out over threads it does not have.
      - name: Run distributed suite at 2 ranks
        shell: julia --project=. --color=yes {0}
        run: |
          using MPI, Printf
          MPI.mpiexec() do mpiexec
              julia = `$(Base.julia_cmd()) --project=. -t 1`
              t = @elapsed run(`$mpiexec -n 2 $julia test/mpi_tests.jl`)
              @printf("=== np = 2 finished in %.1f s ===\n", t)
              run(`$mpiexec -n 2 $julia test/neutral_transport_domain_tests.jl`)
              run(`$mpiexec -n 2 $julia test/substep_rate_tests.jl`)
          end

  mpi8:
    name: MPI at 8 ranks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      # As in the numerics job: the MPI device phases run here, and neither
      # this step nor buildpkg precompiles, so that the one image build
      # happens after the preference is set.
      - name: Set the device precompile preference
        shell: julia --project=. --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          using Pkg
          Pkg.instantiate()
          using Preferences
          Preferences.set_preferences!(
              Base.UUID("b1f6c1e2-4a83-4c5f-9d2e-7c3a1e5b8f10"),
              "precompile_device" => true; force=true)
      - uses: julia-actions/julia-buildpkg@v1
      # As in the numerics job, for comparison with it.
      - name: Report the restored package image
        env:
          JULIA_DEBUG: loading
        run: |
          ls -l ~/.julia/compiled/v*/CompactLES || true
          julia --project=. -e 'println(Sys.CPU_NAME, ": image current = ",
              Base.isprecompiled(Base.identify_package("CompactLES")))'
      # One process builds the image before the launch, with the flags the
      # ranks use, so that eight ranks do not wait on one precompile lock at
      # their first `using` and the build is not timed as part of the first
      # phase. No `--check-bounds=yes`, for the reason given in the numerics
      # job.
      - name: Build the package image
        run: julia --project=. --color=yes -e 'using CompactLES'
      # The runner has four vCPUs. The bundled MPICH (ch4) waits in a
      # collective by spinning with sched_yield between polls, which under
      # Linux CFS does not hand the core to a runnable sibling, so at np = 8
      # every rank blocked in a collective takes a core from a rank still
      # computing or compiling. Measured: the per-rank compile of the suite
      # goes from 181 s at np = 2 to 628 s at np = 8, and a timestep from
      # ~0.04 s to ~7 s, with the step-bound phases (distributed refinement,
      # callback consistency, staged device exchange, sync) 100–250x slower.
      # The full suite at np = 8 was 29 minutes of the job.
      #
      # The package's precompile workload (src/precompile.jl) removes most
      # of the compile from every rank; what remains is step-bound runtime,
      # and with two physical cores even np = 4 pays for it (a full np = 4
      # leg measured 416 s against 58 s at np = 2, with 43 s of compile).
      #
      # So the full suite runs at np = 2 in the numerics job, and this job
      # runs at np = 8 the phases whose code path depends on the rank count,
      # which four ranks would not add to. `rank_shape=true` selects them:
      # RANK_SHAPE_PHASES in test/mpi_tests.jl lists them and gives the
      # reasons, and the core gate in CLAUDE.md runs the same selection.
      # test/substep_rate_tests.jl runs here as well, because its check that
      # the deepest level sits on a subset of the ranks applies only from
      # np = 4. `-t 1` because a rank must not also fan out over threads it
      # does not have.
      - name: Run rank-shape phases at 8 ranks
        shell: julia --project=. --color=yes {0}
        run: |
          using MPI, Printf
          MPI.mpiexec() do mpiexec
              julia = `$(Base.julia_cmd()) --project=. -t 1`
              t = @elapsed run(`$mpiexec -n 8 $julia test/mpi_tests.jl rank_shape=true`)
              @printf("=== np = 8 finished in %.1f s ===\n", t)
              run(`$mpiexec -n 8 $julia test/substep_rate_tests.jl`)
          end

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Configure documentation environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      # The Makie extension is loadable only from this environment (CairoMakie
      # is not in the package's test target, so the serial job records its
      # suite as skipped). Serially, and at two ranks for the
      # decomposition-independent profile.
      - name: Run the Makie extension tests
        shell: julia --project=docs --color=yes {0}
        run: |
          using MPI
          julia = Base.julia_cmd()
          run(`$julia --project=docs test/makie_tests.jl`)
          MPI.mpiexec() do mpiexec
              run(`$mpiexec -n 2 $julia --project=docs -t 1 test/makie_tests.jl`)
          end
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
