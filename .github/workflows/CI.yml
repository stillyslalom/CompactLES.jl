name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - serial
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'pre'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      # The device testsets and the MPI device phases run here, so the
      # workload's device block earns its precompile cost in this job and
      # nowhere else; see PRECOMPILE_DEVICE in src/precompile.jl. Neither
      # this step nor buildpkg precompiles: an image Pkg.instantiate built
      # here would predate the preference and be rebuilt by the first `using`
      # (measured 330 s of every job), and the serial suite builds its own at
      # -O1 with bounds checks in any case.
      - name: Set the device precompile preference
        shell: julia --project=. --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          using Pkg
          Pkg.instantiate()
          using Preferences
          Preferences.set_preferences!(
              Base.UUID("b1f6c1e2-4a83-4c5f-9d2e-7c3a1e5b8f10"),
              "precompile_device" => true; force=true)
      - uses: julia-actions/julia-buildpkg@v1
      # At -O1: the serial suite is compile-bound, and -O1 reuses the -O2
      # image buildpkg made (see test/runtests.jl). julia-runtest has no
      # optimization input, so this is its Pkg.test call with the flag added;
      # Pkg.test keeps its own --check-bounds=yes.
      #
      # The extension suites skip where their weak dependency does not load,
      # and a skip is recorded as a broken test, not a pass. HDF5 is in the
      # test target, so this job expects that suite to run: `require=hdf5`
      # fails the job on the skip instead. Makie is expected to skip here
      # (CairoMakie is not in the test target) and runs in the docs job.
      # `timing=true` prints each testset's wall and compile time after the
      # summary tree (see test/runtests.jl).
      - name: Run the serial suite at -O1
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.test(; coverage=false, julia_args=["-O1"],
                   test_args=["require=hdf5", "timing=true"])

  numerics:
    name: Convergence and MPI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      # The device testsets and the MPI device phases run here, so the
      # workload's device block earns its precompile cost in this job and
      # nowhere else; see PRECOMPILE_DEVICE in src/precompile.jl. Neither
      # this step nor buildpkg precompiles: an image Pkg.instantiate built
      # here would predate the preference and be rebuilt by the first `using`
      # (measured 330 s of every job), and the serial suite builds its own at
      # -O1 with bounds checks in any case.
      - name: Set the device precompile preference
        shell: julia --project=. --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          using Pkg
          Pkg.instantiate()
          using Preferences
          Preferences.set_preferences!(
              Base.UUID("b1f6c1e2-4a83-4c5f-9d2e-7c3a1e5b8f10"),
              "precompile_device" => true; force=true)
      - uses: julia-actions/julia-buildpkg@v1
      # Neither step below runs with `--check-bounds=yes`. That option gives
      # every package in the tree a second precompile cache, which this job
      # would build from scratch before its first test, and it slows all
      # fourteen processes the distributed step launches. The serial suite is
      # already bounds-checked on three Julia versions by julia-runtest, and an
      # index error in the distributed paths moves a convergence order or an
      # interface error away from machine zero, so it does not pass unseen.
      - name: Run convergence guards
        run: julia --project=. --color=yes test/convergence.jl
      # The runner has four vCPUs. The bundled MPICH (ch4) waits in a
      # collective by spinning with sched_yield between polls, which under
      # Linux CFS does not hand the core to a runnable sibling, so at np = 8
      # every rank blocked in a collective takes a core from a rank still
      # computing or compiling. Measured: the per-rank compile of the suite
      # goes from 181 s at np = 2 to 628 s at np = 8, and a timestep from
      # ~0.04 s to ~7 s, with the step-bound phases (distributed refinement,
      # callback consistency, staged device exchange, sync) 100–250x slower.
      # The full suite at np = 8 was 29 minutes of the job.
      #
      # The package's precompile workload (src/precompile.jl) removes most
      # of the compile from every rank; what remains is step-bound runtime,
      # and with two physical cores even np = 4 pays for it (a full np = 4
      # leg measured 416 s against 58 s at np = 2, with 43 s of compile).
      #
      # So the full suite runs at np = 2, and np = 8 runs the phases whose
      # code path depends on the rank count, which four ranks would not add
      # to. Most tests put all ranks on one dimension of SPLITN = 72 points
      # via `splitdims`, and at np = 8 that is 9 points per rank, the C8
      # filter's minimum block and the smallest the reduced-interface
      # solves, the transfer operators, the fold butterfly and the
      # positivity repair ever see: those phases run. Two grids change
      # shape outright: the corner-halo check's default Dims_create grid
      # (2x2x2 at np = 8, 2x1x1 at np = 2) and the tiled fine level's
      # _amr_dims grid (4x2 against 2x1). A composite face's member mask splits
      # across more ranks, and the deep-regrid levels fall onto rank subsets
      # and move a tile only at np = 8. The level coupling's point-to-point
      # messages pair different ranks at each count. The mode-truncation phase splits θ
      # over np / 2 or np ranks and r in two. The slicing phase derives its
      # over-coarse stride from np. The remaining phases (the timestepping
      # runs, the writers, the checkpoint, the sensor comparisons) count
      # ranks or change block sizes only, and they are the step-bound ones.
      # The tiled phase is the leg's cost, ~470 s for twenty steps of a
      # five-patch 2-D case. `-t 1` because a rank must not also fan out
      # over threads it does not have.
      - name: Run distributed suite at 2 ranks, rank-shape phases at 8
        shell: julia --project=. --color=yes {0}
        run: |
          using MPI, Printf
          eight = join(("periodic C6", "pentadiagonal C10", "closed C6",
                        "device line solves", "tiled refinement",
                        "partitioned coupling",
                        "AMR transfer pair", "staggered operators",
                        "halo consistency",
                        "off-rank folds", "mode truncation", "freestream",
                        "no-slip wall flux",
                        "slip wall flux", "symmetry plane",
                        "level at a symmetry plane", "level on the axis",
                        "NSCBC inflow",
                        "NSCBC level face",
                        "positivity floor", "slicing", "composite budgets",
                        "composite face", "deep regrid subsets",
                        "placed levels", "folded regrid", "seam levels",
                        "phase change", "implicit conduction"), ',')
          MPI.mpiexec() do mpiexec
              julia = Base.julia_cmd()
              for (np, args) in ((2, String[]), (8, ["phases=" * eight]))
                  t = @elapsed run(`$mpiexec -n $np $julia --project=. -t 1 test/mpi_tests.jl $args`)
                  @printf("=== np = %d finished in %.1f s ===\n", np, t)
                  run(`$mpiexec -n $np $julia --project=. -t 1 test/neutral_transport_domain_tests.jl`)
                  run(`$mpiexec -n $np $julia --project=. -t 1 test/substep_rate_tests.jl`)
              end
          end

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Configure documentation environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      # The Makie extension is loadable only from this environment (CairoMakie
      # is not in the package's test target, so the serial job records its
      # suite as skipped). Serially, and at two ranks for the
      # decomposition-independent profile.
      - name: Run the Makie extension tests
        shell: julia --project=docs --color=yes {0}
        run: |
          using MPI
          julia = Base.julia_cmd()
          run(`$julia --project=docs test/makie_tests.jl`)
          MPI.mpiexec() do mpiexec
              run(`$mpiexec -n 2 $julia --project=docs -t 1 test/makie_tests.jl`)
          end
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
